name: CI

# Runs on every pull request into main, and on pushes to any branch except main.
# The PR run is what gates the merge button.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

# A newer push to the same branch cancels the older run. On PRs this is safe and
# saves minutes; the main-branch image build lives in a separate workflow.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Guard: enforces the PR-only workflow and the branch naming convention.
  # This is the free stand-in for branch protection. Keep it in THIS workflow
  # so one red check blocks the merge button.
  # ---------------------------------------------------------------------------
  guard:
    name: Guard (PR target + branch name)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out the PR head with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Target branch must be main
        run: |
          if [ "${{ github.base_ref }}" != "main" ]; then
            echo "::error::PRs must target 'main'. This one targets '${{ github.base_ref }}'."
            exit 1
          fi
          echo "Target branch is main."

      - name: Source branch must start with dev/
        run: |
          HEAD="${{ github.head_ref }}"
          case "$HEAD" in
            dev/*)
              echo "Branch name OK: $HEAD"
              ;;
            *)
              echo "::error::Branch '$HEAD' does not match the required convention 'dev/<name>'."
              echo "::error::Rename it:  git branch -m dev/<name>  then push the new name."
              exit 1
              ;;
          esac

      - name: No merge commits on the branch
        run: |
          BASE="origin/${{ github.base_ref }}"
          # Use the PR's real head commit, NOT HEAD.
          #
          # On pull_request events GitHub checks out a synthetic merge commit
          # (refs/pull/<n>/merge) that merges the head branch into the base.
          # That commit has two parents, so `rev-list --merges <base>..HEAD`
          # counts GitHub's own merge and always reports >= 1 - a false failure
          # on every PR. Measuring base..head_sha looks only at the branch.
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          MERGES=$(git rev-list --merges "$BASE..$HEAD_SHA" | wc -l)
          if [ "$MERGES" -gt 0 ]; then
            echo "::error::This branch contains $MERGES merge commit(s). Rebase onto main instead:"
            echo "::error::  git fetch origin && git rebase origin/main"
            exit 1
          fi
          echo "No merge commits."

  # ---------------------------------------------------------------------------
  # Python: the placeholder service today, the vision worker tomorrow.
  # Skips lint/tests cleanly while there is nothing to lint or test.
  # ---------------------------------------------------------------------------
  test:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Byte-compile the Python source
        run: |
          # Exclude virtualenvs, node_modules and build output: they are not our
          # code, and compiling a .venv is slow and can fail on third-party files.
          python -m compileall -q -x '(^|[\\/])(\.venv|venv|env|node_modules|\.git|\.next|dist|build|__pycache__|\.mypy_cache|\.ruff_cache)([\\/]|$)' .
          echo "Python files compile."

      - name: Lint with ruff if configured
        run: |
          if [ -f ruff.toml ] || [ -f .ruff.toml ] || grep -qs '\[tool\.ruff' pyproject.toml; then
            pip install ruff
            ruff check .
          else
            echo "No ruff config yet - skipping. Add ruff.toml or [tool.ruff] to enable."
          fi

      - name: Run pytest if any tests exist
        run: |
          if [ -d tests ] || ls test_*.py >/dev/null 2>&1; then
            pip install pytest
            python -m pytest -q
          else
            echo "No tests found yet - skipping. Add tests/ or test_*.py to enable."
          fi

  # ---------------------------------------------------------------------------
  # Node: the API, the dashboard and the shared TypeScript packages.
  # Skips cleanly until the monorepo lands a root package.json, so this job is
  # green on day one and starts doing real work the moment the scaffold arrives.
  # ---------------------------------------------------------------------------
  node:
    name: Test (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for a Node project
        id: check
        run: |
          if [ -f package.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet - skipping the Node checks."
          fi

      - name: Set up Node
        if: steps.check.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.check.outputs.found == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        if: steps.check.outputs.found == 'true'
        run: npm run lint --if-present

      - name: Type-check
        if: steps.check.outputs.found == 'true'
        run: npm run typecheck --if-present

      - name: Test
        if: steps.check.outputs.found == 'true'
        run: npm test --if-present

      - name: Build
        if: steps.check.outputs.found == 'true'
        run: npm run build --if-present

  # ---------------------------------------------------------------------------
  # Docker build validation on PRs. Builds but does NOT push, so a broken
  # Dockerfile fails the PR instead of being discovered after merge.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether a Dockerfile exists
        id: check
        run: |
          if [ -f Dockerfile ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile yet - skipping the build check."
          fi

      - name: Set up Buildx
        if: steps.check.outputs.found == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image
        if: steps.check.outputs.found == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: local/ci-check:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
