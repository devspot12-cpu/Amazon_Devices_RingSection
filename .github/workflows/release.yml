name: Release

# Builds and pushes the Docker image, but ONLY from main, and only after a PR
# has been merged. Pull requests never trigger this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a release mid-flight: two rapid merges to main would otherwise
# race and one image could be left half-pushed.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: docker.io
  # Image repository name, without the user/org prefix. The full image becomes
  # <dockerhub-user>/<IMAGE_REPO>. Change this one line to rename the image.
  IMAGE_REPO: aws-demo

jobs:
  release:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether a Dockerfile exists
        id: check
        run: |
          if [ -f Dockerfile ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Dockerfile in the repo yet. Add one and this job will push an image."
          fi

      # Resolve credentials BEFORE anything that needs them.
      #
      # GitHub returns an empty string for a secret that does not exist, so a
      # name mismatch used to fail the release with no hint as to which name was
      # wrong. Accepting both spellings makes the pipeline work either way.
      # Note: `secrets` is only available at job/step level, not in the
      # workflow-level `env` block, which is why this happens in a step.
      - name: Resolve Docker Hub credentials
        id: resolve
        if: steps.check.outputs.found == 'true'
        env:
          NAME_PRIMARY: ${{ secrets.DOCKERHUB_USERNAME }}
          NAME_FALLBACK: ${{ secrets.DOCKER_USERNAME }}
          TOKEN_PRIMARY: ${{ secrets.DOCKERHUB_TOKEN }}
          TOKEN_FALLBACK: ${{ secrets.DOCKER_TOKEN }}
        run: |
          USERNAME="${NAME_PRIMARY:-$NAME_FALLBACK}"
          PASSWORD="${TOKEN_PRIMARY:-$TOKEN_FALLBACK}"

          if [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "::error::No Docker Hub credentials found."
            echo "::error::Add them in Settings > Secrets and variables > Actions."
            echo "::error::Username secret - DOCKERHUB_USERNAME or DOCKER_USERNAME"
            echo "::error::Token secret    - DOCKERHUB_TOKEN or DOCKER_TOKEN"
            echo "::error::Found username: $([ -n "$USERNAME" ] && echo yes || echo NO) | found token: $([ -n "$PASSWORD" ] && echo yes || echo NO)"
            exit 1
          fi

          # Mask the password so it can never reach the logs.
          echo "::add-mask::$PASSWORD"

          # Step outputs (not $GITHUB_ENV) so later steps reference them
          # explicitly via steps.resolve.outputs.* - no ambiguity.
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"
          echo "image=$USERNAME/${IMAGE_REPO:-aws-demo}" >> "$GITHUB_OUTPUT"

          echo "Docker Hub user resolved: $USERNAME"
          echo "Image will be pushed as: $USERNAME/${IMAGE_REPO:-aws-demo}"

      - name: Set up Buildx
        if: steps.check.outputs.found == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check.outputs.found == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.resolve.outputs.username }}
          password: ${{ steps.resolve.outputs.password }}

      - name: Derive image tags and labels
        if: steps.check.outputs.found == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.resolve.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        if: steps.check.outputs.found == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
